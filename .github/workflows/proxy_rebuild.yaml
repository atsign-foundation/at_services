name: proxy_rebuild
# Creates a new image for atsigncompany/at_proxyserver whenever updated
# certificates are merged to trunk or if Dockerfile is bumped
on:
  push:
    branches:
      - trunk
    paths:
      - 'packages/at_secondary_proxy/certs/cert.pem'
      - 'packages/at_secondary_proxy/tools/Dockerfile'
  workflow_dispatch:

permissions:  # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  at_proxyserver:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
      contents: read
      attestations: write
    steps:
      - name: Checkout trunk
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Login to DockerHub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push at_proxyserver
        id: docker_build_proxy
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          file: packages/at_secondary_proxy/tools/Dockerfile
          push: true
          tags: |
            atsigncompany/at_proxyserver:latest
            atsigncompany/at_proxyserver:gha${{ github.run_number }}
          platforms: |
            linux/amd64
            linux/arm64/v8
      - name: Attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        id: attest
        with:
          subject-name: index.docker.io/atsigncompany/at_proxyserver
          subject-digest: ${{ steps.docker_build_proxy.outputs.digest }}
          push-to-registry: true
