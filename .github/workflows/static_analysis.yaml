name: static_analysis

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  static_analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: stable

      # Runs dart lint rules
      - name: Install dependencies and run analyze - at_secondary_proxy
        working-directory: packages/at_secondary_proxy
        run: |
          dart pub get
          dart analyze

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@375a0e8ebdc98e99b02ac4338a724f5750f21213 # v2.3.1
        with:
          scan-args: |-
            --lockfile=./packages/at_secondary_proxy/pubspec.lock
