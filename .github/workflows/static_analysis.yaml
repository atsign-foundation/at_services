name: static_analysis

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions: # added using https://github.com/step-security/secure-workflows
  contents: read

jobs:
  static_analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dart-lang/setup-dart@e51d8e571e22473a2ddebf0ef8a2123f0ab2c02c # v1.7.1
        with:
          sdk: stable

      # Runs dart lint rules
      - name: Install dependencies and run analyze - at_secondary_proxy
        working-directory: packages/at_secondary_proxy
        run: |
          dart pub get
          dart analyze

      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@456ceb78310755116e0a3738121351006286b797 # v2.2.1
        with:
          scan-args: |-
            --lockfile=./packages/at_secondary_proxy/pubspec.lock
